# This workflow will build and publish all FxMap ecosystem packages when the version changes.

name: Build FxLink and Publish
env:
  VERSION: 1.0.4

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]
  workflow_dispatch:
    inputs:
      version:
        description: 'Package version to publish (e.g. 1.2.0 or 1.2.0-rc.1). Leave empty to use VERSION from this file.'
        required: false
        type: string

jobs:
  build:
    name: 'build fxlink project'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.x
      - name: Restore dependencies
        run: dotnet restore
      - name: Build
        run: dotnet build --no-restore

  test:
    name: 'run transport and unit tests'
    runs-on: ubuntu-latest
    needs:
      - build
    steps:
      - uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.x
      - name: Restore dependencies
        run: dotnet restore
      - name: Test
        # Every unit/naming test project in the solution, including the per-transport ones — a
        # transport test failing here must block calc-version/publish below, not just get reported
        # after the fact (see docs/lessons-from-fxmap.md item 9). FxLink.IntegrationTests is
        # deliberately NOT included: it exercises real local brokers (RabbitMQ/NATS/SQS containers)
        # that don't exist on this runner yet, and is a local-only suite for now — see
        # tests/FxLink.IntegrationTests/README.md.
        run: |
          dotnet test tests/FxLink.Tests/FxLink.Tests.csproj --no-restore -c Release
          dotnet test tests/FxLink.Nats.Tests/FxLink.Nats.Tests.csproj --no-restore -c Release
          dotnet test tests/FxLink.Azure.ServiceBus.Tests/FxLink.Azure.ServiceBus.Tests.csproj --no-restore -c Release
          dotnet test tests/FxLink.Messaging.EntityFrameworkCore.Tests/FxLink.Messaging.EntityFrameworkCore.Tests.csproj --no-restore -c Release

  calc-version:
    name: Calculate Version
    runs-on: ubuntu-latest
    needs:
      - build
      - test
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - id: v
        env:
          # Passed through the environment rather than interpolated into the script, so a crafted
          # input can never be executed as shell.
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ -n "$INPUT_VERSION" ]; then
            if ! [[ "$INPUT_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
              echo "::error::Invalid version '$INPUT_VERSION' - expected MAJOR.MINOR.PATCH with an optional -prerelease suffix."
              exit 1
            fi
            echo "version=${INPUT_VERSION}" >> $GITHUB_OUTPUT
          elif [ "${{ github.ref }}" = 'refs/heads/master' ]; then
            echo "version=${VERSION}" >> $GITHUB_OUTPUT
          else
            echo "version=${VERSION}-develop.${{ github.run_number }}" >> $GITHUB_OUTPUT
          fi

  publish:
    name: Build and Publish NuGets
    timeout-minutes: 60
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/master' && success()
    needs:
      - calc-version
    steps:
      - name: Version Output Check
        run: echo "Publishing version ${{ needs.calc-version.outputs.version }}"

      - name: Check out code
        uses: actions/checkout@v4

      - name: Install .NET Core SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.x

      - name: Restore Dependencies
        run: dotnet restore

      - name: Build All Projects
        run: dotnet build -c Release -p:Version=${{ needs.calc-version.outputs.version }}

      - name: Pack All Projects
        run: |
          dotnet pack --no-build -c Release -p:PackageVersion=${{ needs.calc-version.outputs.version }} -o ./artifacts

      - name: List Packed Files
        run: ls -al ./artifacts

      - name: Publish NuGets
        working-directory: artifacts
        run: |
          for file in *.nupkg; do
            # FxLink.Azure.ServiceBus is deliberately excluded: unverified against a real broker/emulator yet
            # (see docs/azure-service-bus-transport-design.md) — add it back once that's done.
            # FxLink.RoutingSlip and FxLink.StateMachine no longer exist: both merged into FxLink
            # core — see that version's commit for why. FxLink.StateMachine.EntityFrameworkCore and
            # FxLink.Messaging.EntityFrameworkCore no longer exist either: both merged into the
            # single FxLink.EntityFramework package.
            if [[ "$file" =~ ^(FxLink|FxLink\.(RabbitMq|Aws\.Sqs|Nats|EntityFramework))\.[0-9] ]]; then
              echo "Pushing $file"
              dotnet nuget push "$file" -s https://api.nuget.org/v3/index.json -k ${{ secrets.NUGET_API_KEY }} --skip-duplicate --no-symbols
            else
              echo "Skipping $file (not in allowed list)"
            fi
          done